<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baymax Auth Page</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Knewave&family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-container">
  <h2 class="login">Login</h2>
  <div class="form-container">
  <form class="login-form">
    <input type="text" id="username" name="username" placeholder="Username" required />
    <input type="email" id="email" name="email" placeholder="Email" required />
    <input type="password" id="password" name="password" placeholder="Password" required />
    <button id="login-button" type="submit">Log-In</button>
    <div class="divider"></div>
    <div class="socials">
      <a href="#" class="social-button"><img src="./fav_icons/apple-logo.png" alt="Apple-Logo"></a>
      <a href="#" class="social-button"><img src="./fav_icons/search.png" alt="Google-Logo"></a>
      <a href="#" class="social-button"><img src="./fav_icons/facebook.png" alt="Facebook-Logo"></a>
    </div>
    <p class="register">New User<a href="#" class="register-link"> Register?</a></p>
  </form>
  </div>
  </div>
</body>
</html>
